# ===========================================================================
# Secret — credenciales de la base de datos.
# Los valores reales llegan desde values.local.yaml (no versionado).
# ===========================================================================
apiVersion: v1
kind: Secret
metadata:
  name: misuper
  namespace: {{ .Release.Namespace }}
  labels:
    app: misuper
type: Opaque
stringData:
  DB_PASSWORD: {{ required "secrets.dbPassword es obligatorio (values.local.yaml)" .Values.secrets.dbPassword | quote }}
  MYSQL_ROOT_PASSWORD: {{ required "secrets.mysqlRootPassword es obligatorio (values.local.yaml)" .Values.secrets.mysqlRootPassword | quote }}
